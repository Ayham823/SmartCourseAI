name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: smartcourse_eval_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q server tests
      - name: Run deterministic test suite
        run: python -m pytest -q
      - name: Check browser JavaScript syntax
        run: node --check client/app.js
      - name: Cache public embedding weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: minilm-l6-v2-v1-${{ runner.os }}
      - name: Cache the embedding model (no generative API)
        run: python -c 'from sentence_transformers import SentenceTransformer; SentenceTransformer("sentence-transformers/all-MiniLM-L6-v2")'
      - name: Evaluate real offline retrieval
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/smartcourse_eval_ci
          SMARTCOURSE_EVAL_DISPOSABLE_DB: '1'
        run: python -m evaluation.retrieval --output .artifacts/retrieval.json
      - name: Write verification summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(".artifacts/retrieval.json")
          if path.exists():
              data = json.loads(path.read_text())
              summary = data.get("metrics", data)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
                  stream.write("### Retrieval evaluation\n\n```json\n" + json.dumps(summary, indent=2) + "\n```\n")
          PY
      - name: Retain retrieval evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: .artifacts/retrieval.json
          if-no-files-found: ignore
